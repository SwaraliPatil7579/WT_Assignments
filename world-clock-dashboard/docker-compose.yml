services:
  world-clock-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: world-clock-dashboard
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - clock-network

  # Optional: Development service with hot reload
  world-clock-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: world-clock-dashboard-dev
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    profiles:
      - dev
    networks:
      - clock-network

networks:
  clock-network:
    driver: bridge
