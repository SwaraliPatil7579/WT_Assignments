# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# MySQL Datasource
# Create the database first:  CREATE DATABASE vit_result_db;
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/vit_result_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=sql@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Load data.sql after Hibernate creates the schema (demo/sample data)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ===============================
# Jackson
# ===============================
spring.jackson.default-property-inclusion=non_null
